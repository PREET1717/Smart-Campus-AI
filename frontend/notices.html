<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Campus AI - Notices & Events</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
        }

        .header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .section h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .notice,
        .event {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .notice h3,
        .event h3 {
            margin-top: 0;
            color: #111827;
        }

        .notice p,
        .event p {
            color: #555;
        }

        .date {
            color: #1e3a8a;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📢 Notices & Events</h1>
        <p>Smart Campus AI</p>
    </div>


    <div class="container">

        <!-- NOTICES -->

        <div class="section">

            <h2>📢 College Notices</h2>

            <div id="notices">
                ⏳ Loading notices...
            </div>

        </div>


        <!-- EVENTS -->

        <div class="section">

            <h2>📅 Upcoming Events</h2>

            <div id="events">
                ⏳ Loading events...
            </div>

        </div>


        <a href="index.html" class="back">
            ← Back to Dashboard
        </a>

    </div>


    <script>

        // ==========================================
        // LOAD NOTICES
        // ==========================================

        async function loadNotices() {

            const box =
                document.getElementById("notices");

            box.innerHTML =
                "⏳ Loading notices...";


            if (!window.supabaseClient) {

                box.innerHTML =
                    "❌ Supabase is not connected.";

                return;
            }


            const {
                data,
                error
            } =
                await window.supabaseClient
                    .from("notices")
                    .select("*")
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {

                console.error(error);

                box.innerHTML =
                    "❌ Failed to load notices.<br>" +
                    error.message;

                return;
            }


            if (!data || data.length === 0) {

                box.innerHTML =
                    '<div class="empty">No notices available.</div>';

                return;
            }


            box.innerHTML = "";


            data.forEach(notice => {

                const div =
                    document.createElement("div");

                div.className = "notice";


                const date =
                    new Date(
                        notice.created_at
                    ).toLocaleString();


                div.innerHTML = `

                    <h3>
                        📌 ${notice.title}
                    </h3>

                    <p>
                        ${notice.description || ""}
                    </p>

                    <div class="date">
                        📅 ${date}
                    </div>

                `;


                box.appendChild(div);

            });

        }


        // ==========================================
        // LOAD EVENTS
        // ==========================================

        async function loadEvents() {

            const box =
                document.getElementById("events");

            box.innerHTML =
                "⏳ Loading events...";


            if (!window.supabaseClient) {

                box.innerHTML =
                    "❌ Supabase is not connected.";

                return;
            }


            const {
                data,
                error
            } =
                await window.supabaseClient
                    .from("events")
                    .select("*")
                    .order("event_date", {
                        ascending: true
                    });


            if (error) {

                console.error(error);

                box.innerHTML =
                    "❌ Failed to load events.<br>" +
                    error.message;

                return;
            }


            if (!data || data.length === 0) {

                box.innerHTML =
                    '<div class="empty">No upcoming events.</div>';

                return;
            }


            box.innerHTML = "";


            data.forEach(event => {

                const div =
                    document.createElement("div");

                div.className = "event";


                const date =
                    event.event_date
                    ?
                    new Date(
                        event.event_date
                    ).toLocaleString()
                    :
                    "Date not available";


                div.innerHTML = `

                    <h3>
                        🎯 ${event.title}
                    </h3>

                    <p>
                        ${event.description || ""}
                    </p>

                    <p>
                        📅 <strong>Date:</strong>
                        ${date}
                    </p>

                    <p>
                        📍 <strong>Location:</strong>
                        ${event.location || "Not specified"}
                    </p>

                `;


                box.appendChild(div);

            });

        }


        // ==========================================
        // PAGE LOAD
        // ==========================================

        window.addEventListener(
            "load",
            function() {

                loadNotices();
                loadEvents();

            }
        );

    </script>

</body>

</html>
