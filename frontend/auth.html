<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI - Login / Signup</title>
    
    <!-- UPDATED: Naya Supabase link jo kabhi fail nahi hoga -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <style>
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #1e3a8a; margin-bottom: 5px; }
        p.subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }
        h3 { color: #333; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; outline: none; }
        .input-group input:focus { border-color: #1e3a8a; }
        
        .btn { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s;}
        .btn:hover { background: #152b69; }
        
        .toggle-link { color: #1e3a8a; cursor: pointer; font-size: 14px; text-decoration: none; margin-top: 20px; display: inline-block; font-weight: bold;}
        .toggle-link:hover { text-decoration: underline; }
        
        .error-msg { color: #dc2626; margin-top: 15px; font-weight: bold; font-size: 14px;}
        .success-msg { color: #16a34a; margin-top: 15px; font-weight: bold; font-size: 14px;}
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>🎓 Smart Campus AI</h2>
        <p class="subtitle">Smart Campus Management System</p>
        <h3 id="formTitle">Student Signup</h3>

        <!-- Signup Form -->
        <div id="signupForm">
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="signupName" placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)">
            </div>
            <button class="btn" onclick="signup()">Create Account</button>
            <span class="toggle-link" onclick="toggleForm('login')">Already have an account? Login</span>
        </div>

        <!-- Login Form -->
        <div id="loginForm" style="display: none;">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <span class="toggle-link" onclick="toggleForm('signup')">Don't have an account? Signup</span>
        </div>

        <div id="authMessage" class="error-msg"></div>
    </div>

    <script>
        // Check if database is connected
        window.onload = function() {
            if (!window.supabaseClient) {
                document.getElementById('authMessage').innerText = "❌ Connection failed. Please Refresh (Ctrl+Shift+R).";
            }
        };

        function toggleForm(type) {
            document.getElementById('authMessage').innerText = "";
            if (type === 'login') {
                document.getElementById('signupForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('formTitle').innerText = 'Student Login';
            } else {
                document.getElementById('signupForm').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('formTitle').innerText = 'Student Signup';
            }
        }

        async function signup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const msgBox = document.getElementById('authMessage');
            
            msgBox.className = "error-msg";
            msgBox.innerText = "⏳ Creating account...";

            if (!email || !password || !name) {
                msgBox.innerText = "❌ Please fill all fields";
                return;
            }

            if (!window.supabaseClient) {
                 msgBox.innerText = "❌ Cannot connect to database. Refresh the page.";
                 return;
            }

            try {
                const { data, error } = await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { name: name } }
                });

                if (error) throw error;
                
                // Add user to custom database table
                if (data.user) {
                    await window.supabaseClient.from('users').insert({
                        id: data.user.id,
                        name: name,
                        role: 'STUDENT'
                    });
                }

                msgBox.className = "success-msg";
                msgBox.innerText = "✅ Account created! Redirecting...";
                setTimeout(() => window.location.href = "index.html", 1500);

            } catch (error) {
                console.error("Signup Error:", error);
                msgBox.className = "error-msg";
                msgBox.innerText = "❌ " + error.message;
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msgBox = document.getElementById('authMessage');

            msgBox.className = "error-msg";
            msgBox.innerText = "⏳ Logging in...";

            if (!email || !password) {
                msgBox.innerText = "❌ Please fill all fields";
                return;
            }

            if (!window.supabaseClient) {
                 msgBox.innerText = "❌ Cannot connect to database. Refresh the page.";
                 return;
            }

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                msgBox.className = "success-msg";
                msgBox.innerText = "✅ Login successful!";
                
                // Check Role and redirect
                const { data: userData } = await window.supabaseClient
                    .from('users')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                setTimeout(() => {
                    if (userData && (userData.role === 'ADMIN' || userData.role === 'MAINTENANCE')) {
                         window.location.href = "maintenance-dashboard.html";
                    } else {
                         window.location.href = "index.html";
                    }
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                msgBox.className = "error-msg";
                msgBox.innerText = "❌ " + error.message;
            }
        }
    </script>
</body>
</html>
