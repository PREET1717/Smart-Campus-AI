</div>

<script>


// ==========================================
// SHOW SIGNUP
// ==========================================

function showSignup() {

    document.getElementById(
        "loginBox"
    ).style.display =
        "none";


    document.getElementById(
        "signupBox"
    ).style.display =
        "block";


    document.getElementById(
        "message"
    ).innerText =
        "";

}



// ==========================================
// SHOW LOGIN
// ==========================================

function showLogin() {

    document.getElementById(
        "signupBox"
    ).style.display =
        "none";


    document.getElementById(
        "loginBox"
    ).style.display =
        "block";


    document.getElementById(
        "message"
    ).innerText =
        "";

}



// ==========================================
// MESSAGE
// ==========================================

function showMessage(
    text,
    type = "normal"
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    if (
        type === "error"
    ) {

        message.style.color =
            "#dc2626";

    }

    else if (
        type === "success"
    ) {

        message.style.color =
            "#16a34a";

    }

    else {

        message.style.color =
            "#374151";

    }

}



// ==========================================
// SIGNUP
// ==========================================

async function signup() {


    const name =
        document
            .getElementById(
                "signupName"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "signupEmail"
            )
            .value
            .trim()
            .toLowerCase();


    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    // CHECK FIELDS

    if (
        !name ||
        !email ||
        !password
    ) {

        showMessage(
            "❌ Please fill all fields.",
            "error"
        );

        return;

    }


    // PASSWORD

    if (
        password.length < 6
    ) {

        showMessage(
            "❌ Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    // SUPABASE

    if (
        !window.supabaseClient
    ) {

        showMessage(
            "❌ Supabase is not connected.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "signupButton"
        );


    button.disabled = true;

    button.innerText =
        "Creating...";


    try {


        const {

            data,
            error

        } =
            await window.supabaseClient

                .auth

                .signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        data: {

                            name:
                                name

                        }

                    }

                });


        // SIGNUP ERROR

        if (error) {

            console.error(
                "Signup Error:",
                error
            );


            showMessage(
                "❌ " + error.message,
                "error"
            );

            return;

        }


        if (
            !data?.user
        ) {

            showMessage(
                "❌ Account creation failed.",
                "error"
            );

            return;

        }


        // ==========================================
        // IF SESSION EXISTS
        // ==========================================

        if (
            data.session
        ) {

            showMessage(
                "✅ Account created successfully!",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                1000
            );


            return;

        }


        // ==========================================
        // NO SESSION
        // ==========================================

        showMessage(
            "✅ Account created! You can now login.",
            "success"
        );


        setTimeout(
            () => {

                showLogin();

            },
            800
        );

    }


    catch (error) {

        console.error(
            "Signup Error:",
            error
        );


        showMessage(
            "❌ Something went wrong during signup.",
            "error"
        );

    }


    finally {

        button.disabled = false;

        button.innerText =
            "Create Account";

    }

}



// ==========================================
// LOGIN
// ==========================================

async function login() {


    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;


    // CHECK FIELDS

    if (
        !email ||
        !password
    ) {

        showMessage(
            "❌ Please enter email and password.",
            "error"
        );

        return;

    }


    // SUPABASE

    if (
        !window.supabaseClient
    ) {

        showMessage(
            "❌ Supabase is not connected.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.innerText =
        "Logging in...";


    try {


        // ==========================================
        // LOGIN
        // ==========================================

        const {

            data,
            error

        } =
            await window.supabaseClient

                .auth

                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        // LOGIN ERROR

        if (error) {

            console.error(
                "Login Error:",
                error
            );


            showMessage(
                "❌ " + error.message,
                "error"
            );

            return;

        }


        const user =
            data?.user;


        if (!user) {

            showMessage(
                "❌ Login failed.",
                "error"
            );

            return;

        }


        // ==========================================
        // GET PROFILE
        // ==========================================

        const {

            data: profile,
            error: profileError

        } =
            await window.supabaseClient

                .from("users")

                .select(
                    "name, email, role"
                )

                .eq(
                    "id",
                    user.id
                )

                .maybeSingle();


        if (profileError) {

            console.error(
                "Profile Error:",
                profileError
            );


            showMessage(
                "✅ Login successful, but profile could not be loaded.",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                1000
            );


            return;

        }


        // ==========================================
        // ROLE
        // ==========================================

        const role =
            (
                profile?.role ||
                "STUDENT"
            )
            .toUpperCase()
            .trim();


        console.log(
            "LOGIN ROLE:",
            role
        );


        showMessage(
            "✅ Login successful!",
            "success"
        );


        // ==========================================
        // ROLE BASED REDIRECTION
        // ==========================================

        setTimeout(
            () => {


                // STUDENT

                if (
                    role ===
                    "STUDENT"
                ) {

                    window.location.href =
                        "index.html";

                }


                // ADMIN

                else if (
                    role ===
                    "ADMIN"
                ) {

                    window.location.href =
                        "admin-dashboard.html";

                }


                // FACULTY

                else if (
                    role ===
                    "FACULTY"
                ) {

                    window.location.href =
                        "faculty-dashboard.html";

                }


                // SECURITY

                else if (
                    role ===
                    "SECURITY"
                ) {

                    window.location.href =
                        "admin-emergency.html";

                }


                // MAINTENANCE

                else if (
                    role ===
                    "MAINTENANCE"
                ) {

                    window.location.href =
                        "maintenance-dashboard.html";

                }


                // UNKNOWN ROLE

                else {

                    console.warn(
                        "Unknown role:",
                        role
                    );


                    window.location.href =
                        "index.html";

                }

            },
            700
        );

    }


    catch (error) {

        console.error(
            "Login Error:",
            error
        );


        showMessage(
            "❌ Login failed. Please try again.",
            "error"
        );

    }


    finally {

        button.disabled = false;

        button.innerText =
            "Login";

    }

}

</script>
