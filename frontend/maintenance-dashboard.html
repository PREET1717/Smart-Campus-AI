<script>


// =====================================
// CHECK MAINTENANCE ACCESS
// =====================================

async function checkMaintenanceAccess() {

    try {


        // SUPABASE CHECK

        if (!window.supabaseClient) {

            alert(
                "❌ Supabase is not connected."
            );

            window.location.href =
                "auth.html";

            return false;
        }


        // GET USER

        const {

            data: userData,
            error: userError

        } =
            await supabaseClient
                .auth
                .getUser();


        if (
            userError ||
            !userData?.user
        ) {

            alert(
                "❌ Please login first."
            );

            window.location.href =
                "auth.html";

            return false;
        }


        const user =
            userData.user;


        // GET PROFILE

        const {

            data: profile,
            error: profileError

        } =
            await supabaseClient

                .from("users")

                .select(
                    "name, role"
                )

                .eq(
                    "id",
                    user.id
                )

                .maybeSingle();


        if (profileError) {

            console.error(
                profileError
            );

            alert(
                "❌ Unable to verify your role."
            );

            window.location.href =
                "index.html";

            return false;
        }


        const role =
            (
                profile?.role ||
                "STUDENT"
            ).toUpperCase();


        // MAINTENANCE ALLOWED

        if (
            role === "MAINTENANCE"
        ) {

            document.getElementById(
                "maintenanceName"
            ).innerText =
                "🔧 " +
                (
                    profile?.name ||
                    "Maintenance Team"
                );


            document.getElementById(
                "accessLoading"
            ).style.display =
                "none";


            document.getElementById(
                "dashboardContent"
            ).style.display =
                "block";


            return true;
        }


        // ADMIN ALSO ALLOWED

        if (
            role === "ADMIN"
        ) {

            document.getElementById(
                "maintenanceName"
            ).innerText =
                "🔧 Maintenance Dashboard — Admin";


            document.getElementById(
                "accessLoading"
            ).style.display =
                "none";


            document.getElementById(
                "dashboardContent"
            ).style.display =
                "block";


            return true;
        }


        // ACCESS DENIED

        alert(
            "❌ Access Denied. Maintenance team only."
        );


        window.location.href =
            "index.html";


        return false;

    }

    catch (error) {

        console.error(
            "Access Error:",
            error
        );


        alert(
            "❌ Access verification failed."
        );


        window.location.href =
            "auth.html";


        return false;
    }

}



// =====================================
// MESSAGE
// =====================================

function showMessage(
    text,
    type
) {

    const box =
        document.getElementById(
            "message"
        );


    box.innerText =
        text;


    box.className =
        "message " + type;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3000
    );

}



// =====================================
// LOAD COMPLAINTS
// =====================================

async function loadComplaints() {

    const container =
        document.getElementById(
            "complaintsContainer"
        );


    container.innerHTML =
        "Loading complaints...";


    try {


        const {

            data,
            error

        } =
            await supabaseClient

                .from("complaints")

                .select("*")

                .eq(
                    "department",
                    "Maintenance"
                )

                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                );


        if (error) {

            console.error(
                "Complaint Error:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    ❌ Failed to load complaints.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

            return;
        }


        const complaints =
            data || [];


        updateStatistics(
            complaints
        );


        if (
            complaints.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    ✅ No maintenance complaints available.

                </div>

            `;

            return;
        }


        let html = `

            <table>

                <tr>

                    <th>
                        Complaint
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Priority
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Date
                    </th>

                </tr>

        `;


        complaints.forEach(
            complaint => {


                html += `

                    <tr>

                        <td>

                            ${escapeHTML(
                                complaint
                                    .complaint_text
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                complaint.category
                                || "-"
                            )}

                        </td>


                        <td>

                            ${escapeHTML(
                                complaint.priority
                                || "-"
                            )}

                        </td>


                        <td>

                            <select

                                class="status-select"

                                onchange="
                                    updateComplaintStatus(
                                        '${complaint.id}',
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value="PENDING"
                                    ${
                                        complaint.status ===
                                        "PENDING"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    PENDING
                                </option>


                                <option
                                    value="IN_PROGRESS"
                                    ${
                                        complaint.status ===
                                        "IN_PROGRESS"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    IN PROGRESS
                                </option>


                                <option
                                    value="RESOLVED"
                                    ${
                                        complaint.status ===
                                        "RESOLVED"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    RESOLVED
                                </option>

                            </select>

                        </td>


                        <td>

                            ${formatDate(
                                complaint.created_at
                            )}

                        </td>

                    </tr>

                `;

            }
        );


        html +=
            "</table>";


        container.innerHTML =
            html;

    }

    catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}



// =====================================
// UPDATE STATISTICS
// =====================================

function updateStatistics(
    complaints
) {

    const pending =
        complaints.filter(
            c =>
                c.status ===
                "PENDING"
        ).length;


    const inProgress =
        complaints.filter(
            c =>
                c.status ===
                "IN_PROGRESS"
        ).length;


    const resolved =
        complaints.filter(
            c =>
                c.status ===
                "RESOLVED"
        ).length;


    document.getElementById(
        "totalComplaints"
    ).innerText =
        complaints.length;


    document.getElementById(
        "pendingComplaints"
    ).innerText =
        pending;


    document.getElementById(
        "inProgressComplaints"
    ).innerText =
        inProgress;


    document.getElementById(
        "resolvedComplaints"
    ).innerText =
        resolved;

}



// =====================================
// UPDATE STATUS
// =====================================

async function updateComplaintStatus(
    id,
    status
) {

    try {


        const {

            error

        } =
            await supabaseClient

                .from("complaints")

                .update({

                    status:
                        status

                })

                .eq(
                    "id",
                    id
                );


        if (error) {

            console.error(
                error
            );


            showMessage(
                "❌ Failed to update complaint.",
                "error"
            );


            return;
        }


        showMessage(
            "✅ Complaint status updated!",
            "success"
        );


        await loadComplaints();

    }

    catch (error) {

        console.error(
            error
        );


        showMessage(
            "❌ Something went wrong.",
            "error"
        );

    }

}



// =====================================
// FORMAT DATE
// =====================================

function formatDate(date) {

    if (!date) {

        return "-";

    }


    return new Date(
        date
    ).toLocaleString();

}



// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;

}



// =====================================
// LOGOUT
// =====================================

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "auth.html";

}



// =====================================
// START
// =====================================

checkMaintenanceAccess().then(
    isAllowed => {

        if (isAllowed) {

            loadComplaints();

        }

    }
);


</script>
